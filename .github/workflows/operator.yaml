name: Operator Example
on: workflow_dispatch
jobs:
  operator:
    runs-on: ubuntu-latest
    steps:
      # 논리연산
      - name: Logical Operators
        run: |
          echo "AND: ${{ true && false }}"
          echo "OR: ${{ true || false }}"
          echo "NOT: ${{ !true }}"

      # 비교연산
      - name: Comparison Operators
        run: |
          echo "Equal: ${{ 10 == 10 }}"
          echo "Not Equal: ${{ 10 != 20 }}"
          echo "Greater: ${{ 10 > 5 }}"
          echo "Less: ${{ 10 < 5 }}"
          echo "Greater Equal: ${{ 10 >= 10 }}"
          echo "Less Equal: ${{ 10 <= 20 }}"
          echo "Type Error: ${{ false == 1 }}"